name: CI

on:
  push:
    branches-ignore:
      - screenshots
  pull_request:
    # labeled/unlabeled: adding or removing `memory-approved` re-runs the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  # CLAUDE.md › Restrictions (R1–R6): frameworks, dependencies, network,
  # idle work, child processes, bundle contents. Fast; runs on Linux.
  policy:
    name: Policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrictions (R1–R6)
        run: ./scripts/policy-check.sh

  # Pull requests only: the PR's build against its base branch, same runner,
  # alternating rounds. Fails on more than +5 MB in any scenario or +512 KB
  # of executable, unless a maintainer adds the `memory-approved` label.
  memory-regression:
    name: Memory vs. base branch
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build base and PR
        run: |
          (cd base && ./scripts/bundle.sh)
          ./scripts/bundle.sh

      - name: Compare memory and size
        env:
          ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'memory-approved') && '1' || '0' }}
        run: ./scripts/memory-compare.sh base/dist/Pulse.app dist/Pulse.app

  build-and-measure:
    name: Build & memory budget
    # Same runner image as release.yml, so CI proves the release build too.
    runs-on: macos-14
    permissions:
      contents: write   # to publish screenshots to the `screenshots` branch
    steps:
      - uses: actions/checkout@v4

      - name: Build and bundle
        run: ./scripts/bundle.sh

      # In-process end-to-end tests: windows stay off screen, the app never
      # activates, and every file they touch is in a temp folder.
      - name: Tests
        run: swift test

      - name: Memory budget (fails above 100 MB)
        run: ./scripts/memory-check.sh dist/Pulse.app

      - name: Screenshots
        if: always()
        continue-on-error: true
        run: ./scripts/screenshot.sh dist/Pulse.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: dist/screenshots/*.png
          if-no-files-found: ignore

      # Real screenshots of the latest build, at a stable URL for docs:
      # https://raw.githubusercontent.com/<owner>/<repo>/screenshots/<branch>/light.png
      - name: Publish screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          ls dist/screenshots/*.png >/dev/null
          BRANCH="${GITHUB_REF_NAME//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin screenshots:screenshots 2>/dev/null || true
          git worktree add -f /tmp/shots screenshots 2>/dev/null || {
            git worktree add --detach /tmp/shots
            git -C /tmp/shots checkout --orphan screenshots
            git -C /tmp/shots rm -rfq .
          }
          mkdir -p "/tmp/shots/$BRANCH"
          rm -rf "/tmp/shots/$BRANCH"/*; cp dist/screenshots/*.png "/tmp/shots/$BRANCH/"
          git -C /tmp/shots add -A
          git -C /tmp/shots commit -qm "Screenshots for $BRANCH @ ${GITHUB_SHA::7}" || exit 0
          git -C /tmp/shots push -q origin screenshots
