name: Release Pulse

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -f "VERSION" ]; then
            RAW_VER=$(tr -d '[:space:]' < VERSION)
            TAG_NAME="v$RAW_VER"
          else
            RAW_VER="1.0.0"
            TAG_NAME="v1.0.0"
          fi
          echo "version=$RAW_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Make Scripts Executable
        run: chmod +x scripts/package.sh install.sh

      - name: Build and Package Release Artifacts
        run: ./scripts/package.sh "${{ steps.version_step.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pulse ${{ steps.version_step.outputs.tag }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/pulse.rb
          draft: false
          prerelease: false
          generate_release_notes: true
