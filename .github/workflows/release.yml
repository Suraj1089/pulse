name: Release Pulse

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write

    # Run if triggered by a tag OR if commit message contains "release:"
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, 'release:')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            RAW_VER=$(echo "$COMMIT_MSG" | grep -oE 'release:[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
            if [ -z "$RAW_VER" ]; then
              RAW_VER="1.0.0"
            fi
            TAG_NAME="v$RAW_VER"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" --force
          fi
          echo "version=$RAW_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Make Scripts Executable
        run: chmod +x scripts/package.sh install.sh

      - name: Build and Package Release Artifacts
        run: ./scripts/package.sh "${{ steps.version_step.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Pulse ${{ steps.version_step.outputs.tag }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/pulse.rb
          draft: false
          prerelease: false
          generate_release_notes: true
