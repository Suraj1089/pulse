name: Release Pulse

# Every push to main that passes CI (build, tests, memory budget) and
# changes the app becomes a release, so the website's "latest" download
# links, install.sh and the in-app Update button always serve the newest
# build. Pushes that only touch the website, docs, install.sh, tests or CI
# (nothing in the app since the last release) are skipped.
#
# Version: VERSION holds major.minor.patch. If that exact version has no
# release yet, it is released as is (so a manual bump to 2.1.0 ships 2.1.0).
# Otherwise the next patch after the highest release in that major.minor is
# used (2.0.0 → 2.0.1 → 2.0.2 …). Pushing a v* tag still releases that tag.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time, so two quick pushes cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    # Only after a successful CI run of a push (not a pull request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The exact commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Compares with the last release, not just this push, so a docs push
      # followed by a code push still ships the code.
      - name: Check for app changes
        id: changes
        run: |
          git fetch --tags --force --quiet
          LAST=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ "${{ github.event_name }}" != "workflow_run" ] || [ -z "$LAST" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          APP_FILES=$(git diff --name-only "$LAST" HEAD \
            | grep -vE '^(site/|assets/|Tests/|\.github/)|\.md$|^LICENSE$|^install\.sh$' || true)
          if [ -z "$APP_FILES" ]; then
            echo "Nothing in the app changed since $LAST (website, docs, tests or CI only); no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "App changes since $LAST:"; echo "$APP_FILES" | sed 's/^/  /'
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Version
        if: steps.changes.outputs.release == 'true'
        id: version_step
        run: |
          git fetch --tags --force --quiet
          if [[ "${{ github.ref }}" == refs/tags/v* && "${{ github.event_name }}" == "push" ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "1.0.0")
            if ! git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
              RAW_VER="$BASE"
            else
              MAJOR_MINOR="${BASE%.*}"
              LAST=$(git tag --list "v$MAJOR_MINOR.*" | sed 's/^v//' | sort -t. -k3,3n | tail -1)
              RAW_VER="$MAJOR_MINOR.$(( ${LAST##*.} + 1 ))"
            fi
          fi
          echo "Releasing $RAW_VER"
          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW_VER" >> "$GITHUB_OUTPUT"

      - name: Make Scripts Executable
        if: steps.changes.outputs.release == 'true'
        run: chmod +x scripts/package.sh install.sh

      - name: Build and Package Release Artifacts
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/package.sh "${{ steps.version_step.outputs.version }}"

      - name: Create GitHub Release
        if: steps.changes.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: Pulse ${{ steps.version_step.outputs.tag }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/pulse.rb
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
